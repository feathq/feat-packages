name: Publish @feathq/feat-eval

on:
  push:
    tags: ["feat-eval@v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @feathq/feat-eval run build
      - run: yarn workspace @feathq/feat-eval pack --out /tmp/pkg.tgz
      - run: npm publish /tmp/pkg.tgz --provenance --access public
